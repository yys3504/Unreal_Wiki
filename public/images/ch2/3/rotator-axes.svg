<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <marker id="arrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="86" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="40" font-weight="700">FRotator Axes: Pitch, Yaw, Roll</text>
  <text x="64" y="126" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="24">Unreal Axis: X Forward, Y Right, Z Up</text>

  <g transform="translate(610,390)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#60a5fa" stroke-width="10" marker-end="url(#arrowX)"/>
    <line x1="0" y1="0" x2="-220" y2="145" stroke="#22c55e" stroke-width="10" marker-end="url(#arrowY)"/>
    <line x1="0" y1="0" x2="0" y2="-260" stroke="#f59e0b" stroke-width="10" marker-end="url(#arrowZ)"/>

    <circle cx="0" cy="0" r="22" fill="#e2e8f0" opacity="0.9"/>

    <path d="M 66 -26 A 76 76 0 1 1 -8 74" fill="none" stroke="#93c5fd" stroke-width="7"/>
    <text x="102" y="-18" fill="#bfdbfe" font-family="Segoe UI, Arial" font-size="24" font-weight="700">Roll (X axis)</text>

    <path d="M -118 44 A 150 76 0 0 1 106 40" fill="none" stroke="#86efac" stroke-width="7"/>
    <text x="-268" y="78" fill="#bbf7d0" font-family="Segoe UI, Arial" font-size="24" font-weight="700">Pitch (Y axis)</text>

    <path d="M 24 -204 A 176 176 0 1 1 -24 -204" fill="none" stroke="#fcd34d" stroke-width="7"/>
    <text x="82" y="-216" fill="#fde68a" font-family="Segoe UI, Arial" font-size="24" font-weight="700">Yaw (Z axis)</text>

    <text x="358" y="10" fill="#93c5fd" font-family="Consolas, monospace" font-size="26" font-weight="700">+X</text>
    <text x="-262" y="178" fill="#86efac" font-family="Consolas, monospace" font-size="26" font-weight="700">+Y</text>
    <text x="18" y="-268" fill="#fcd34d" font-family="Consolas, monospace" font-size="26" font-weight="700">+Z</text>
  </g>

  <rect x="64" y="562" width="1152" height="112" rx="14" fill="#0f172a" opacity="0.88" stroke="#334155"/>
  <text x="94" y="614" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="27" font-weight="700">Constructor Order in C++: FRotator(Pitch, Yaw, Roll)</text>
  <text x="94" y="652" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="23">Even if names are shown as Yaw/Pitch/Roll in UI, constructor argument order is Pitch first.</text>
</svg>