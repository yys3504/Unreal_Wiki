<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#13233d"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>

  <text x="62" y="84" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="42" font-weight="700">Rotator 기본 축 개념</text>
  <text x="62" y="124" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="26">언리얼 기준 축: X(전방), Y(오른쪽), Z(위)</text>

  <g transform="translate(540,420)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="#ef4444" stroke-width="11" marker-end="url(#arrowRed)"/>
    <line x1="0" y1="0" x2="-230" y2="150" stroke="#22c55e" stroke-width="11" marker-end="url(#arrowGreen)"/>
    <line x1="0" y1="0" x2="0" y2="-270" stroke="#3b82f6" stroke-width="11" marker-end="url(#arrowBlue)"/>

    <circle cx="0" cy="0" r="24" fill="#e2e8f0" opacity="0.9"/>

    <text x="348" y="8" fill="#fca5a5" font-family="Segoe UI, Arial" font-size="30" font-weight="700">X축 (전방)</text>
    <text x="-312" y="182" fill="#bbf7d0" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Y축 (오른쪽)</text>
    <text x="20" y="-284" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Z축 (위)</text>
  </g>

  <rect x="64" y="686" width="1152" height="114" rx="16" fill="#0f172a" opacity="0.9" stroke="#334155"/>
  <text x="96" y="732" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="30" font-weight="700">FRotator(Pitch, Yaw, Roll)</text>
  <text x="96" y="768" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="24">Pitch는 Y축, Yaw는 Z축, Roll은 X축 회전을 의미합니다.</text>
</svg>