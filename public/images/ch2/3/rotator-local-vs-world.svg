<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0f1b2f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="64" y="80" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="38" font-weight="700">Local Rotation vs World Rotation</text>

  <rect x="64" y="128" width="552" height="500" rx="18" fill="#111827" stroke="#334155"/>
  <text x="96" y="178" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="30" font-weight="700">AddActorLocalRotation</text>
  <text x="96" y="216" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="22">Rotate around actor's own axes</text>

  <g transform="translate(330,398) rotate(-18)">
    <line x1="0" y1="0" x2="170" y2="0" stroke="#60a5fa" stroke-width="8"/>
    <line x1="0" y1="0" x2="-110" y2="80" stroke="#22c55e" stroke-width="8"/>
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#f59e0b" stroke-width="8"/>
    <polygon points="0,-44 84,0 0,44 -84,0" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  </g>

  <rect x="664" y="128" width="552" height="500" rx="18" fill="#111827" stroke="#334155"/>
  <text x="696" y="178" fill="#86efac" font-family="Segoe UI, Arial" font-size="30" font-weight="700">SetActorRotation / World Basis</text>
  <text x="696" y="216" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="22">Align with global world axes</text>

  <g transform="translate(930,398)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#60a5fa" stroke-width="8"/>
    <line x1="0" y1="0" x2="-130" y2="92" stroke="#22c55e" stroke-width="8"/>
    <line x1="0" y1="0" x2="0" y2="-145" stroke="#f59e0b" stroke-width="8"/>
    <polygon points="0,-44 84,0 0,44 -84,0" fill="#1e293b" stroke="#64748b" stroke-width="4" transform="rotate(38)"/>
  </g>

  <text x="98" y="586" fill="#bfdbfe" font-family="Segoe UI, Arial" font-size="21">Good for spin, turret, wheel, hinge-like behavior</text>
  <text x="698" y="586" fill="#bbf7d0" font-family="Segoe UI, Arial" font-size="21">Good for exact facing direction and deterministic orientation</text>
</svg>