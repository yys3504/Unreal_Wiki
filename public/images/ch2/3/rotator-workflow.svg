<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172036"/>
      <stop offset="100%" stop-color="#1f2b45"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg3)"/>
  <text x="64" y="84" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="40" font-weight="700">Typical Rotator Workflow in Unreal C++</text>

  <rect x="64" y="140" width="260" height="430" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="94" y="204" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="28" font-weight="700">1. Measure</text>
  <text x="94" y="250" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="21">Current rotation</text>
  <text x="94" y="286" fill="#94a3b8" font-family="Consolas, monospace" font-size="19">GetActorRotation()</text>

  <rect x="360" y="140" width="260" height="430" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="390" y="204" fill="#86efac" font-family="Segoe UI, Arial" font-size="28" font-weight="700">2. Build</text>
  <text x="390" y="250" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="21">Target rotation</text>
  <text x="390" y="286" fill="#94a3b8" font-family="Consolas, monospace" font-size="19">FRotator(Pitch, Yaw, Roll)</text>

  <rect x="656" y="140" width="260" height="430" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="686" y="204" fill="#fcd34d" font-family="Segoe UI, Arial" font-size="28" font-weight="700">3. Interp</text>
  <text x="686" y="250" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="21">Smooth transition</text>
  <text x="686" y="286" fill="#94a3b8" font-family="Consolas, monospace" font-size="19">FMath::RInterpTo</text>

  <rect x="952" y="140" width="260" height="430" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="982" y="204" fill="#fca5a5" font-family="Segoe UI, Arial" font-size="28" font-weight="700">4. Apply</text>
  <text x="982" y="250" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="21">Set or Add</text>
  <text x="982" y="286" fill="#94a3b8" font-family="Consolas, monospace" font-size="19">SetActorRotation()</text>

  <line x1="324" y1="356" x2="360" y2="356" stroke="#64748b" stroke-width="5"/>
  <polygon points="360,356 346,347 346,365" fill="#64748b"/>
  <line x1="620" y1="356" x2="656" y2="356" stroke="#64748b" stroke-width="5"/>
  <polygon points="656,356 642,347 642,365" fill="#64748b"/>
  <line x1="916" y1="356" x2="952" y2="356" stroke="#64748b" stroke-width="5"/>
  <polygon points="952,356 938,347 938,365" fill="#64748b"/>

  <rect x="64" y="604" width="1148" height="74" rx="14" fill="#111827" stroke="#334155"/>
  <text x="94" y="650" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="25" font-weight="700">Tip: For camera and aiming, FindLookAtRotation + RInterpTo is a common and stable pattern.</text>
</svg>