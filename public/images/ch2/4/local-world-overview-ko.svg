<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#16243d"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="54" y="78" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="40" font-weight="700">Local Space vs World Space</text>
  <text x="54" y="118" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="24">월드 기준 좌표와 액터 자체 기준 좌표를 한 화면에서 비교</text>

  <rect x="54" y="150" width="560" height="530" rx="18" fill="#111827" stroke="#334155"/>
  <text x="86" y="204" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="30" font-weight="700">World Space (고정 기준)</text>
  <text x="86" y="238" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="21">레벨 전체에서 공통으로 쓰는 절대 좌표계</text>

  <g transform="translate(320,454)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="180" y2="0" stroke="#ef4444" stroke-width="9" marker-end="url(#arrowRed)"/>
    <line x1="0" y1="0" x2="-120" y2="88" stroke="#22c55e" stroke-width="9" marker-end="url(#arrowGreen)"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#3b82f6" stroke-width="9" marker-end="url(#arrowBlue)"/>
    <circle cx="0" cy="0" r="22" fill="#e2e8f0" opacity="0.9"/>
  </g>

  <rect x="666" y="150" width="560" height="530" rx="18" fill="#111827" stroke="#334155"/>
  <text x="698" y="204" fill="#fcd34d" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Local Space (액터 기준)</text>
  <text x="698" y="238" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="21">액터 자체를 기준으로 해석하는 상대 좌표계</text>

  <g transform="translate(940,454)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="2" opacity="0.35"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#475569" stroke-width="2" opacity="0.35"/>

    <g transform="rotate(-28)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="#ef4444" stroke-width="9" marker-end="url(#arrowRed)"/>
      <line x1="0" y1="0" x2="-120" y2="88" stroke="#22c55e" stroke-width="9" marker-end="url(#arrowGreen)"/>
      <line x1="0" y1="0" x2="0" y2="-150" stroke="#3b82f6" stroke-width="9" marker-end="url(#arrowBlue)"/>
    </g>

    <circle cx="0" cy="0" r="22" fill="#e2e8f0" opacity="0.9"/>
  </g>
</svg>